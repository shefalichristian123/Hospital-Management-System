<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administrator Setup | Hospital Management</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #eef5ff;

        }


        .container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .card {

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(15, 23, 42, 0.10);

        }


        .icon {

            width: 65px;

            height: 65px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #2563eb;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

        }


        h1 {

            text-align: center;

            color: #111827;

            font-size: 24px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;

        }


        .info {

            background: #eff6ff;

            color: #1e40af;

            border-radius: 8px;

            padding: 12px;

            font-size: 13px;

            margin-bottom: 20px;

        }


        .error {

            background: #fee2e2;

            color: #991b1b;

            border-radius: 8px;

            padding: 12px;

            font-size: 13px;

            margin-bottom: 20px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px
                rgba(37, 99, 235, 0.1);

        }


        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        .footer {

            text-align: center;

            margin-top: 22px;

            font-size: 12px;

            color: #94a3b8;

        }


    </style>

</head>


<body>


    <div class="container">

        <div class="card">


            <div class="icon">
                🔐
            </div>


            <h1>
                Administrator Setup
            </h1>


            <p class="subtitle">
                Create the administrator account for your
                Hospital Management System.
            </p>


            <div class="info">

                This page is available only during the
                first-time setup. Your password will be
                securely hashed before it is stored.

            </div>


            {% if error %}

            <div class="error">

                {{ error }}

            </div>

            {% endif %}


            <form
                action="{{ url_for('setup') }}"
                method="POST">


                <div class="form-group">

                    <label for="username">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Create username"
                        minlength="3"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm password"
                        minlength="6"
                        required>

                </div>


                <button type="submit">

                    Create Administrator

                </button>


            </form>


            <div class="footer">

                Hospital Management System

            </div>


        </div>

    </div>


</body>

</html>
